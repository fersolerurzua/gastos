<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saldo Personal</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:700px;margin:20px auto;padding:15px}
.card{border:1px solid #ddd;border-radius:12px;padding:15px;margin-bottom:15px}
input,button{padding:10px;font-size:16px;margin:5px 0;width:100%;box-sizing:border-box}
button{cursor:pointer}
.saldo{font-size:32px;font-weight:bold}
.item{border-top:1px solid #eee;padding:10px 0}
.small{color:#666;font-size:13px}
</style>
</head>
<body>
<h1>Saldo Personal</h1>

<div class="card">
<label>Saldo inicial</label>
<input type="number" id="saldoInicial" placeholder="Ej. 500000">
<button onclick="guardarSaldoInicial()">Guardar saldo inicial</button>
</div>

<div class="card">
<div>Saldo actual</div>
<div class="saldo" id="saldoActual">$0</div>
</div>

<div class="card">
<h3>Registrar gasto</h3>
<input type="number" id="monto" placeholder="Monto">
<input type="text" id="descripcion" placeholder="Descripción">
<button onclick="agregarGasto()">Agregar gasto</button>
</div>

<div class="card">
<h3>Historial</h3>
<div id="historial"></div>
</div>

<script>
let saldoInicial = Number(localStorage.getItem("saldoInicial") || 0);
let gastos = JSON.parse(localStorage.getItem("gastos") || "[]");

function formato(n){
 return "$" + Math.round(n).toLocaleString("es-CL");
}

function guardar(){
 localStorage.setItem("saldoInicial", saldoInicial);
 localStorage.setItem("gastos", JSON.stringify(gastos));
}

function saldoActual(){
 return saldoInicial - gastos.reduce((a,g)=>a+Number(g.monto),0);
}

function guardarSaldoInicial(){
 saldoInicial = Number(document.getElementById("saldoInicial").value || 0);
 guardar();
 render();
}

function agregarGasto(){
 const monto = Number(document.getElementById("monto").value);
 const descripcion = document.getElementById("descripcion").value || "";
 if(!monto) return;

 gastos.unshift({
   fecha: new Date().toLocaleString("es-CL"),
   monto,
   descripcion
 });

 guardar();
 document.getElementById("monto").value="";
 document.getElementById("descripcion").value="";
 render();
}

function render(){
 document.getElementById("saldoActual").textContent = formato(saldoActual());

 const h = document.getElementById("historial");
 h.innerHTML = "";

 let saldoCorriente = saldoInicial;

 const cronologico = [...gastos].reverse();
 const saldos = [];
 cronologico.forEach(g=>{
   saldoCorriente -= Number(g.monto);
   saldos.push(saldoCorriente);
 });

 const mostrar = [...gastos];
 mostrar.forEach((g,idx)=>{
   const saldoDespues = saldos[saldos.length-1-idx];
   const div = document.createElement("div");
   div.className = "item";
   div.innerHTML =
     "<strong>"+(g.descripcion || "(sin descripción)")+"</strong><br>" +
     "-"+formato(g.monto)+"<br>" +
     "<span class='small'>"+g.fecha+"</span><br>" +
     "<span class='small'>Saldo: "+formato(saldoDespues)+"</span>";
   h.appendChild(div);
 });
}

document.getElementById("saldoInicial").value = saldoInicial || "";
render();
</script>
</body>
</html>
